<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2418"/>
      <stop offset="1" stop-color="#304226"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1de"/>
      <stop offset="1" stop-color="#d5cfb6"/>
    </linearGradient>
  </defs>

  <!-- rounded military-green badge -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- subtle diagonal wear stripes -->
  <g opacity="0.055" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <line x1="70" y1="140" x2="140" y2="70"/>
    <line x1="120" y1="210" x2="210" y2="120"/>
    <line x1="170" y1="280" x2="280" y2="170"/>
    <line x1="220" y1="350" x2="350" y2="220"/>
    <line x1="270" y1="420" x2="420" y2="270"/>
    <line x1="320" y1="490" x2="490" y2="320"/>
  </g>

  <!-- targeting ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#9ec27a" stroke-width="12"/>
  <circle cx="256" cy="256" r="174" fill="#0a100a" opacity="0.55"/>

  <!-- crosshair ticks -->
  <g fill="#9ec27a">
    <rect x="247" y="18" width="18" height="44" rx="5"/>
    <rect x="247" y="450" width="18" height="44" rx="5"/>
    <rect x="18" y="247" width="44" height="18" rx="5"/>
    <rect x="450" y="247" width="44" height="18" rx="5"/>
  </g>

  <!-- survivor / Unturned monogram -->
  <path d="M170 130 H232 V290 Q256 318 280 290 V130 H342 V310 Q342 400 256 400 Q170 400 170 310 Z"
        fill="#000000" opacity="0.30" transform="translate(9,11)"/>
  <path d="M170 130 H232 V290 Q256 318 280 290 V130 H342 V310 Q342 400 256 400 Q170 400 170 310 Z"
        fill="url(#gold)" stroke="#0d140c" stroke-width="10" stroke-linejoin="round"/>

  <!-- danger dot -->
  <circle cx="256" cy="72" r="11" fill="#c86b61" stroke="#0d140c" stroke-width="5"/>
</svg>
